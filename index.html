}

// ── Render helpers ──
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) { for (const k in attrs) { const v = attrs[k];
    // 值为 false / null 的属性直接跳过：否则 setAttribute('disabled', false) 会写出
    // disabled="false"，而 HTML 中只要 disabled 属性存在按钮就被禁用（曾导致上下移按钮全灰）。
    if (k.startsWith('on')) { if (typeof v === 'function') e.addEventListener(k.slice(2), v); }
    else if (v === false || v == null) { /* skip */ }
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'className') e.className = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else e.setAttribute(k, v);
  } }
  for (const c of children) { if (c == null) continue; if (typeof c === 'string') { if (c.startsWith('<')) { const span = document.createElement('span'); span.style.display='inline-flex'; span.style.alignItems='center'; span.innerHTML = c; e.appendChild(span); } else e.appendChild(document.createTextNode(c)); } else e.appendChild(c); }
  return e;
}

function h(tag, attrs, ...children) { return el(tag, attrs, ...children); }

// ── 附加小标题渲染（教育背景 / 荣誉奖项 / 其他信息 共用）──
// opts: { hasHead:boolean, parentBullet:元素段前符号|null }
function renderExtraLeadsBlock(sec, item, opts) {
  if (!Array.isArray(item.extraLeads) || !item.extraLeads.length) return null;
  const hasHead = !!(opts && opts.hasHead);
  const bullet = opts ? opts.parentBullet : null;
  const elGap = item.extraLeadGap != null ? item.extraLeadGap : 10; // 0~100 份
  const elLayout = item.extraLeadLayout === 'col' ? 'col' : (item.extraLeadLayout === 'two' ? 'two' : 'row');
  // 附加小标题上间距：有头部行(标题/副标题/时间)时与「标题→正文」一致；无头部行时紧贴、不留空位
  const headGapPx = hasHead ? (state.contentTitleDescGap || 2) : 0;
  const extraBulletMode = item.extraLeadBullet || '';
  const wantBullet = (function() {
    if (extraBulletMode === 'none') return false;
    if (extraBulletMode === 'symbol' || extraBulletMode === 'icon') return true;
    return !!bullet; // 跟随条目
  })();
  const bulletColor = item.bulletColor != null ? item.bulletColor : (styleSettings.itemBulletColor || '#1a1a1a');
  const bulletGap = ((item.bulletGap != null ? item.bulletGap : styleSettings.itemBulletGap) || 4) + 'px';
  const makeBullet = function() {
    if (!wantBullet) return null;
    return extraLeadBulletSpan(item, bulletColor, bulletGap);
  };

  if (elLayout === 'col') {
    const extraWrap = h('div', { style:{ marginBottom:'2px', marginTop: headGapPx + 'px' } });
    const colRowGap = item.extraLeadRowGap != null ? item.extraLeadRowGap : 0; // 行与行纵向间距(px)
    var colRowN = 0;
    item.extraLeads.forEach(function(el) {
      if (!el || (!el.title && !el.text)) return;
      const row = h('div', { style:{ display:'flex', alignItems:'baseline', marginTop: (colRowN++ > 0 ? colRowGap : 0) + 'px' } });
      const b = makeBullet();
      if (b) row.appendChild(b);
      if (el.title) {
        let t = String(el.title);
        if (sec.type !== 'honors' && !/[：:]$/.test(t)) t += '：';
        const tStyle = Object.assign({ whiteSpace:'nowrap', lineHeight: styleSettings.bodyLineHeight != null ? styleSettings.bodyLineHeight : '1.5' }, fontStyle(state, 'extraLead'));
        row.appendChild(h('span', { className:'plead-text', style: tStyle }, t));
      }
      if (el.text && sec.type !== 'honors') {
        const ds = h('span', { className:'plead-desc', style:{ flex:'1', lineHeight: styleSettings.bodyLineHeight != null ? styleSettings.bodyLineHeight : '1.5' } });
        String(el.text).split(/\n/).forEach(function(line, li) {
          if (li > 0) ds.appendChild(document.createElement('br'));
          ds.appendChild(renderRichText(line));
        });
        row.appendChild(ds);
      }
      extraWrap.appendChild(row);
    });
    return extraWrap;
  } else if (elLayout === 'row') {
    // 横向并排：默认按内容宽度贪心换行；若设置了「每行个数」(extraLeadCols) 则强制每行 N 个
    // 间距 elGap(0~100)：0=条目紧贴左对齐(右侧留白)、100=两端对齐(最右端对齐右缘)、中间按比例均分列间隙
    const rowGapPx = item.extraLeadRowGap != null ? item.extraLeadRowGap : 4; // 行与行纵向间距(px)
    const colsN = (item.extraLeadCols >= 2 && item.extraLeadCols <= 6) ? item.extraLeadCols : 0; // 0=自动
    const useInnerRows = !!colsN;
    const extraStyle = useInnerRows
      ? { display:'flex', flexDirection:'column', rowGap: rowGapPx + 'px', marginBottom:'2px', marginTop: headGapPx + 'px' }
      : { display:'flex', flexWrap:'wrap', rowGap: rowGapPx + 'px', marginBottom:'2px', marginTop: headGapPx + 'px' };
    const extraWrap = h('div', { style: extraStyle });
    const cols = [];
    item.extraLeads.forEach(function(el) {
      if (!el || (!el.title && !el.text)) return;
      const col = h('div', { style:{ display:'flex', alignItems:'baseline', flex:'0 0 auto', minWidth:'0' } });
      const b = makeBullet();
      if (b) col.appendChild(b);
      if (el.title) {
        let t = String(el.title);
        if (sec.type !== 'honors' && !/[：:]$/.test(t)) t += '：';
        const tStyle = Object.assign({ whiteSpace:'nowrap', lineHeight: styleSettings.bodyLineHeight != null ? styleSettings.bodyLineHeight : '1.5' }, fontStyle(state, 'extraLead'));
        col.appendChild(h('span', { className:'plead-text', style: tStyle }, t));
      }
      if (el.text && sec.type !== 'honors') {
        const ds = h('span', { className:'plead-desc', style:{ lineHeight: styleSettings.bodyLineHeight != null ? styleSettings.bodyLineHeight : '1.5' } });
        String(el.text).split(/\n/).forEach(function(line, li) {
          if (li > 0) ds.appendChild(document.createElement('br'));
          ds.appendChild(renderRichText(line));
        });
        col.appendChild(ds);
      }
      cols.push(col);
    });
    if (useInnerRows) {
      // 每行固定 N 个：每个分组一个独立非换行行容器，保证恰好 N 个一行
      for (let gi = 0; gi < cols.length; gi += colsN) {
        const rowEl = h('div', { style:{ display:'flex', width:'100%', alignItems:'baseline' } });
        for (let k = gi; k < Math.min(gi + colsN, cols.length); k++) rowEl.appendChild(cols[k]);
        extraWrap.appendChild(rowEl);
      }
    } else {
      cols.forEach(function(c) { extraWrap.appendChild(c); });
    }
    if (cols.length >= 2) {
      const apply = function() {
        cols.forEach(function(c) { c.style.marginRight = ''; });
        const rows = [];
        if (useInnerRows) {
          Array.prototype.forEach.call(extraWrap.children, function(rowEl) {
            const rc = Array.prototype.slice.call(rowEl.children);
            if (rc.length >= 2) rows.push({ W: rowEl.clientWidth, cols: rc });
          });
        } else {
          cols.forEach(function(c) {
            const t = c.offsetTop;
            let r = null;
            for (let i = 0; i < rows.length; i++) { if (Math.abs(rows[i].top - t) < 2) { r = rows[i]; break; } }
            if (!r) { r = { top: t, W: extraWrap.clientWidth, cols: [] }; rows.push(r); }
            r.cols.push(c);
          });
        }
        rows.forEach(function(r) {
          const n = r.cols.length;
          if (n < 2) return;
          let total = 0;
          r.cols.forEach(function(c) { total += c.offsetWidth; });
          const free = Math.max(0, r.W - total);
          const per = free * (elGap / 100) / (n - 1);
          // 1px 安全余量：避免 elGap=100 时最右项因亚像素溢出被换行
          const maxPer = (free - 0.5) / (n - 1);
          const finalPer = Math.min(per, maxPer);
          r.cols.forEach(function(c, i) { c.style.marginRight = (i < n - 1) ? finalPer + 'px' : ''; });
        });
      };
      apply();
      requestAnimationFrame(apply);
      extraWrap._applyExtraGap = apply;
      if (!extraWrap._resizeBound) {
        extraWrap._resizeBound = true;
        window.addEventListener('resize', function() { if (extraWrap._applyExtraGap) extraWrap._applyExtraGap(); });
      }
    }
    return extraWrap;
  } else if (elLayout === 'two') {
    // 两列对齐：一行放两个，左右两端对齐（左列靠左、右列靠右），逐行向下
    const gapPx = Math.round((elGap / 100) * 40); // 中缝 0~40px
    const rowGapPx = item.extraLeadRowGap != null ? item.extraLeadRowGap : 4; // 行与行纵向间距(px)
    const extraWrap = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', columnGap: gapPx + 'px', rowGap: rowGapPx + 'px', marginBottom:'2px', marginTop: headGapPx + 'px' } });
    item.extraLeads.forEach(function(el, i) {
      if (!el || (!el.title && !el.text)) return;
      const right = (i % 2 === 1);
      const cell = h('div', { style:{ display:'flex', alignItems:'baseline', justifyContent: right ? 'flex-end' : 'flex-start', minWidth:'0' } });
      const b = makeBullet();
      if (b) cell.appendChild(b);
      if (el.title) {
        let t = String(el.title);
        if (sec.type !== 'honors' && !/[：:]$/.test(t)) t += '：';
        const tStyle = Object.assign({ whiteSpace:'nowrap', lineHeight: styleSettings.bodyLineHeight != null ? styleSettings.bodyLineHeight : '1.5' }, fontStyle(state, 'extraLead'));
        cell.appendChild(h('span', { className:'plead-text', style: tStyle }, t));
      }
      if (el.text && sec.type !== 'honors') {
        const ds = h('span', { className:'plead-desc', style:{ lineHeight: styleSettings.bodyLineHeight != null ? styleSettings.bodyLineHeight : '1.5' } });
        String(el.text).split(/\n/).forEach(function(line, li) {
          if (li > 0) ds.appendChild(document.createElement('br'));
          ds.appendChild(renderRichText(line));
        });
        cell.appendChild(ds);
      }
      extraWrap.appendChild(cell);
    });
    return extraWrap;
  }
  return null;
}

// ── 长按拖动排序（模块卡片） ──
function bindDragSort(card, sectionId) {
  const handle = card.querySelector('.shd');
  if (!handle) return;
  const LONG_PRESS = 400;      // 长按判定时长(ms)
  const MOVE_THRESHOLD = 6;    // 位移阈值(px)，超过则取消长按
  let pressTimer = null;
  let dragging = false;
  let pointerId = null;
  let startX = 0, startY = 0;
  let placeholder = null;
  let dragClone = null;

  function clearPress() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }

  function endDrag(commit) {
    dragging = false;
    if (pointerId != null) { try { handle.releasePointerCapture(pointerId); } catch(e) {} pointerId = null; }
    if (dragClone) { dragClone.remove(); dragClone = null; }
    if (placeholder) { placeholder.remove(); placeholder = null; }
    document.querySelectorAll('.sc.dragging, .sc.drag-over').forEach(function(el) { el.classList.remove('dragging', 'drag-over'); });
    handle.classList.remove('dragging');
    if (commit) { save(); renderSections(); renderPreview(); }
  }

  handle.addEventListener('pointerdown', function(e) {
    // 点在标题输入框/按钮上时不触发拖动（让它们正常交互）
    if (e.target.closest('.sin, .ib, button, input')) return;
    startX = e.clientX; startY = e.clientY;
    pointerId = e.pointerId;
    pressTimer = setTimeout(function() {
      // 长按触发：进入拖动模式
      dragging = true;
      try { handle.setPointerCapture(pointerId); } catch(err) {}
      handle.classList.add('dragging');
      card.classList.add('dragging');
      // 用克隆体跟随指针，原卡片留占位
      const rect = card.getBoundingClientRect();
      dragClone = card.cloneNode(true);
      dragClone.classList.remove('dragging');
      dragClone.classList.add('drag-over');
      dragClone.style.position = 'fixed';
      dragClone.style.width = rect.width + 'px';
      dragClone.style.left = rect.left + 'px';
      dragClone.style.top = rect.top + 'px';
      dragClone.style.zIndex = '1000';
      dragClone.style.pointerEvents = 'none';
      dragClone.style.opacity = '0.92';
      dragClone.style.boxShadow = '0 8px 24px rgba(0,0,0,.25)';
      document.body.appendChild(dragClone);
      // 占位保持原卡片空间
      placeholder = document.createElement('div');
      placeholder.style.height = rect.height + 'px';
      placeholder.style.marginBottom = '12px';
      placeholder.style.border = '1px dashed var(--accent)';
      placeholder.style.borderRadius = 'var(--r)';
      card.parentNode.insertBefore(placeholder, card);
      card.style.display = 'none';
      pressTimer = null;
    }, LONG_PRESS);
  });

  handle.addEventListener('pointermove', function(e) {
    if (!dragging) {
      // 未拖动时若位移过大，取消长按
      if (pressTimer && (Math.abs(e.clientX - startX) > MOVE_THRESHOLD || Math.abs(e.clientY - startY) > MOVE_THRESHOLD)) {
        clearPress();
      }
      return;
    }
    if (dragClone) {
      dragClone.style.left = (e.clientX - dragClone.offsetWidth / 2) + 'px';
      dragClone.style.top = (e.clientY - 30) + 'px';
    }
    // 检测指针落在哪个卡片上，移动占位
    const cards = Array.from(document.querySelectorAll('#editor-body .sc')).filter(function(c) { return c !== card && c.style.display !== 'none'; });
    let target = null;
    cards.forEach(function(c) {
      const r = c.getBoundingClientRect();
      if (e.clientY >= r.top && e.clientY <= r.bottom) target = c;
    });
    if (target) {
      const pr = target.getBoundingClientRect();
      const before = e.clientY < pr.top + pr.height / 2;
      const anchor = before ? target : target.nextSibling;
      if (anchor !== placeholder.nextSibling && anchor !== placeholder) {
        if (before) target.parentNode.insertBefore(placeholder, target);
        else target.parentNode.insertBefore(placeholder, target.nextSibling);
      }
    }
  });

  function finish(e) {
    clearPress();
    if (!dragging) return;
    // 计算最终位置：占位当前所在 index
    const secs = state.resume.sections;
    const oldIdx = secs.findIndex(function(s) { return s.id === sectionId; });
    if (oldIdx < 0) { endDrag(false); return; }
    const [moved] = secs.splice(oldIdx, 1);
    let newIdx = 0;
    if (placeholder && placeholder.parentNode) {
      const cardsInDom = Array.from(placeholder.parentNode.querySelectorAll('.sc'));
      // placeholder 不在 .sc 里，用 placeholder 前有多少 .sc 来定位
      let count = 0, node = placeholder.previousSibling;
      while (node) { if (node.classList && node.classList.contains('sc') && node.style.display !== 'none') count++; node = node.previousSibling; }
      newIdx = count;
    }
    secs.splice(newIdx, 0, moved);
    endDrag(true);
  }

  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', function(e) { clearPress(); if (dragging) endDrag(true); });
}

   if (liveItems.length) sdiv.appendChild(h('div', { style: { height: gap + 'px' } }));

   if (sec.type === 'other') {
     // 其他信息：左标题、右内容（总起小标题 + 正文 + 任务点）；左列宽度按该模块最长标题自适应
     var otherTitleCols = [];
     liveItems.forEach(function(item, idx) {
        const ig = state.itemGap != null ? state.itemGap : cfg.ig;
        const isLast = idx === liveItems.length - 1;
        const idiv = h('div', { className:'pitem', style:{ marginBottom: (isLast ? 0 : ig) + 'px', display:'flex', alignItems:'flex-start' } });
        // 左列：标题（整条独立一列，宽度渲染后统一为最长标题宽度）；无标题时不渲染空列，避免占位空白
        if (item.title) {
          const lcol = h('div', { className:'pother-lcol', style:{ flex:'0 0 auto', whiteSpace:'nowrap', marginRight:'10px' } });
          lcol.appendChild(h('span', { className:'pititle', style: fontStyle(state, 'itemTitle') }, item.title));
          idiv.appendChild(lcol);
          otherTitleCols.push(lcol);
        }
        // 右列：总起小标题 + 正文 + 任务点（向下排列、左对齐）
        const rcol = h('div', { className:'pother-rcol', style:{ flex:'1 1 auto', minWidth:'0' } });
        var cnt = { n: 0 };
        var bullet = resolveBullet(item, cnt);
        if (item.lead) rcol.appendChild(renderLeadBlock(item.lead, bullet, item.description));
        else if (item.description) rcol.appendChild(renderDescBlock(item.description, bullet));
        (item.points || []).forEach(function(p) {
          if (!p || (!p.lead && !p.description)) return;
          var pb = resolveBullet(item, cnt);
          if (p.lead) rcol.appendChild(renderLeadBlock(p.lead, pb, p.description));
          else if (p.description) rcol.appendChild(renderDescBlock(p.description, pb, { marginTop: (state.contentTitleDescGap||2) + 'px' }));
        });
        // 其他信息：右列也支持「附加小标题」（标题+内容，带横向/纵向/两列排列与纵向间距）
        {
          const oew = renderExtraLeadsBlock(sec, item, { hasHead: !!item.title, parentBullet: bullet });
          if (oew) rcol.appendChild(oew);
        }
        idiv.appendChild(rcol);
        sdiv.appendChild(idiv);
     });
  } else {
    liveItems.forEach(function(item, idx) {
       const isLast = idx === liveItems.length - 1;
       const ig = state.itemGap != null ? state.itemGap : cfg.ig;
       const idiv = h('div', { className:'pitem', style:{ marginBottom: (isLast ? 0 : ig) + 'px' } });
       var dateText = (item.startDate||'') + (item.startDate&&item.endDate?' - ':'') + (item.endDate||'');
       var hasDate = !!(item.startDate || item.endDate);
       var layout = (sec.headLayout != null && sec.headLayout !== '') ? sec.headLayout : (state.itemHeadLayout || 'cab');

       var titleSt = fontStyle(state, 'itemTitle');
       if (state.itemTitleSize == null && state.contentTitleFontSize) titleSt.fontSize = state.contentTitleFontSize + 'pt';
       var subSt = fontStyle(state, 'itemSub');
       var dateSt = fontStyle(state, 'itemDate');

       var titleEl = h('span', { className:'pititle', style: titleSt }, item.title);
       var subEl = h('span', { className:'pisub', style: subSt }, item.subtitle);
       var dateEl = h('span', { className:'pidate', style: dateSt }, dateText);

       // 头部行（标题/副标题/时间）全空时不渲染占位行，避免那行 .pihead 的 margin 撑出多余间距
       var hasHead = hasDate || !!item.title || !!item.subtitle;
       if (layout === 'abc') {
         // 标题左 | 副标题中 | 时间右（同一行）
         var ihd = h('div', { className:'pihead' });
         if (item.title) ihd.appendChild(h('span', { style:{ textAlign:'left' } }, h('span', { className:'pititle', style: titleSt }, item.title)));
         if (item.subtitle) ihd.appendChild(h('span', { style:{ textAlign:'center' } }, h('span', { className:'pisub', style: subSt }, item.subtitle)));
         if (hasDate) ihd.appendChild(h('span', { style:{ textAlign:'right' } }, dateEl));
         if (hasHead) idiv.appendChild(ihd);
       } else if (layout === 'ab-c') {
         // 标题+副标题在左（中间用竖线隔开），时间在右
         var hr1 = h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'baseline' } });
         var leftWrap = h('span', { style:{ display:'flex', alignItems:'baseline', minWidth:'0', flex:'1 1 auto' } });
         if (item.title) leftWrap.appendChild(h('span', { className:'pititle', style: titleSt }, item.title));
         if (item.title && item.subtitle) leftWrap.appendChild(h('span', { style:{ margin:'0 6px', color:'#ccc', userSelect:'none' } }, '|'));
         if (item.subtitle) leftWrap.appendChild(h('span', { className:'pisub', style: subSt }, item.subtitle));
         hr1.appendChild(leftWrap);
         if (hasDate) hr1.appendChild(h('span', { className:'pidate', style: dateSt, flexShrink:'0' }, dateText));
         if (hasHead) idiv.appendChild(hr1);
       } else {
         // cab：时间左 | 标题中 | 副标题右（同一行）
         var ihd2 = h('div', { className:'pihead' });
         if (hasDate) ihd2.appendChild(h('span', { style:{ textAlign:'left' } }, dateEl));
         if (item.title) ihd2.appendChild(h('span', { style:{ textAlign:'center' } }, h('span', { className:'pititle', style: titleSt }, item.title)));
         if (item.subtitle) ihd2.appendChild(h('span', { style:{ textAlign:'right' } }, h('span', { className:'pisub', style: subSt }, item.subtitle)));
         if (hasHead) idiv.appendChild(ihd2);
       }
        var cnt = { n: 0 };
        var bullet = resolveBullet(item, cnt);
        // 附加小标题：独立渲染，不依赖 courses 是否有数据（用户经常需要「标题+正文」而没有课程表格）
        {
          const ew = renderExtraLeadsBlock(sec, item, { hasHead: hasHead, parentBullet: bullet });
          if (ew) idiv.appendChild(ew);
        }
        if (sec.type === 'education' && item.coursesAsTable !== false && Array.isArray(item.courses) && item.courses.length) {
          idiv.appendChild(renderCoursesTable(item, bullet, item.description));
        } else if (sec.type === 'education' && item.lead) idiv.appendChild(renderLeadBlock(item.lead, bullet, item.description, false));
        else if (item.lead) idiv.appendChild(renderLeadBlock(item.lead, bullet, item.description));
        else if (hasText(item.description)) idiv.appendChild(renderDescBlock(item.description, bullet, { marginTop: (state.contentTitleDescGap||2) + 'px' }));
        // 额外任务点（总起小标题 + 正文 组合，所有板块通用；第一组即上方的 lead/description）
        (item.points || []).forEach(function(p) {
          if (!p || (!hasText(p.lead) && !hasText(p.description))) return;
          var pb = resolveBullet(item, cnt);
          if (p.lead) idiv.appendChild(renderLeadBlock(p.lead, pb, p.description));
          else if (hasText(p.description)) idiv.appendChild(renderDescBlock(p.description, pb, { marginTop: (state.contentTitleDescGap||2) + 'px' }));
        });
       sdiv.appendChild(idiv);
     });
   }
    pv.appendChild(sdiv);
  });

  container.innerHTML = '';
  container.appendChild(pv);
  // 预览重建后重新应用缩放（缩放级别 zoomLevel 保持不变，仅 DOM 元素被替换）
  applyZoom();

  // 其他信息模块：把左列标题宽度统一设为「该模块内最长标题」的宽度，实现左标题右内容的两列对齐
  var applyOtherColWidth = function() {
    pv.querySelectorAll('.psec').forEach(function(sec) {
      var cols = sec.querySelectorAll('.pother-lcol');
      if (!cols.length) return;
      var maxW = 0;
      cols.forEach(function(c) { c.style.width = 'auto'; });
      cols.forEach(function(c) { var w = c.offsetWidth; if (w > maxW) maxW = w; });
      cols.forEach(function(c) { c.style.width = maxW + 'px'; });
    });
  };
  applyOtherColWidth();
  requestAnimationFrame(applyOtherColWidth);

  // 其他信息两栏：让左列「标题」与右列「总起小标题」的文字中心处于同一水平线。
  // 两栏本是顶对齐，字号不同 → 行盒高度不同 → 中心错位。做法：取两者行盒的较大值 H，
  // 各自补 (H - 自身行盒高)/2 的上内边距，使两行文字都垂直居中于同一高度 H，中心自然对齐。
  var alignScale = (zoomLevel / 100) || 1;
  pv.querySelectorAll('.psec').forEach(function(sec) {
    sec.querySelectorAll('.pitem').forEach(function(item) {
      var lcol = item.querySelector('.pother-lcol');
      var rcol = item.querySelector('.pother-rcol');
      if (!lcol || !rcol) return;
      var ltitle = lcol.querySelector('.pititle');
      var firstBlock = rcol.firstElementChild;
      if (!ltitle || !firstBlock) { lcol.style.paddingTop = ''; if (firstBlock) firstBlock.style.paddingTop = ''; return; }
      var lineEl = rcol.querySelector('.plead-text') || rcol.querySelector('.plead-desc') || rcol.querySelector('.pidesc');
      var rects = lineEl ? lineEl.getClientRects() : null;
      var fr = (rects && rects.length) ? rects[0] : firstBlock.getBoundingClientRect();
      var ltH = ltitle.getBoundingClientRect().height / alignScale;  // 左列标题行盒高
      var rtH = (fr.height || 0) / alignScale;                       // 右列第一行行盒高
      var H = Math.max(ltH, rtH);
      lcol.style.paddingTop = Math.round(Math.max(0, H - ltH) / 2) + 'px';
      firstBlock.style.paddingTop = Math.round(Math.max(0, H - rtH) / 2) + 'px';
    });
  });

  // 统一「模块底部 → 下一模块标题」的间距：清除每个模块内「最后一个可见元素」的下外边距。
  // 以 .plead（总起小标题/附加小标题）或 .pihead（条目头部行）结尾的模块，会比以 .pidesc
  // （描述正文）结尾的模块多出约 2px，使「荣誉奖项 → 其他信息」看着比别的模块间距大。
  // 归零后所有模块间距严格等于「模块间距」这一设置值。
  var clearSecTrailingMargin = function(el) {
    var kids = Array.prototype.slice.call(el.children);
    for (var i = kids.length - 1; i >= 0; i--) {
      var k = kids[i];
      if (k.offsetHeight > 0.5 && k.offsetWidth > 0.5) {
        k.style.marginBottom = '0px';
        clearSecTrailingMargin(k);
        break;
      }
    }
  };
  pv.querySelectorAll('.psec').forEach(function(sec) { clearSecTrailingMargin(sec); });

  // 内容字间距/行间距：仅作用于内容模块的正文条目（.psec .pitem），
  // 不影响个人信息板块（.pshd）和模块标题（.pstitle 自带行高）
  if (state.globalLetterSpacing || state.globalLineHeight) {
    pv.querySelectorAll('.psec .pitem').forEach(function(it) {
      if (state.globalLetterSpacing) it.style.letterSpacing = state.globalLetterSpacing + 'px';
      if (state.globalLineHeight) it.style.lineHeight = state.globalLineHeight;
    });
  }

  // 正文字体（字体排版设置 → 正文行）：作用于正文文本
  // （.pidesc 普通正文 / .plead-desc 总起小标题及附加小标题后的正文），
  // 不影响标题、副标题、时间、总起小标题等各自有独立样式的元素
  var bodySt = fontStyle(state, 'body');
  if (Object.keys(bodySt).length) {
    pv.querySelectorAll('.pidesc, .plead-desc').forEach(function(t) {
      var st = bodySt;
      // 表格下方正文若已设 item 级字号(data-td-size)，保留该字号不被全局正文字号覆盖，其余 body 样式照常
      if (t.getAttribute('data-td-size') && bodySt.fontSize) { st = Object.assign({}, bodySt); delete st.fontSize; }
      Object.assign(t.style, st);
    });
  }
  // 课程表格字体（独立调整）：未设置时跟随正文字体
  var coursesSt = fontStyle(state, 'courses');
  if (Object.keys(coursesSt).length) {
    pv.querySelectorAll('.pcourses').forEach(function(t) {
      Object.assign(t.style, coursesSt);
    });
  } else if (Object.keys(bodySt).length) {
    pv.querySelectorAll('.pcourses').forEach(function(t) {
      Object.assign(t.style, bodySt);
    });
  }

  // 预览固定为 A4 一页：.pview 高 297mm + overflow:hidden，超出 A4 的内容直接裁掉、不可见；
  // 不再绘制任何分页提示线。

  // Version badge
  const badge = document.getElementById('version-badge');
  if (state.activeVersionId) {
    const v = state.versions.find(function(x) { return x.id === state.activeVersionId; });
    badge.textContent = v ? v.name : '';
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

function exportPDF() {
  const pv = document.getElementById('resume-preview');
  if (!pv) return;
  // 复用主页面的完整样式表，保证导出 PDF 与预览 100% 一致
  const mainStyle = document.querySelector('style');
  const baseCss = mainStyle ? mainStyle.textContent : '';
  const w = window.open('', '_blank', 'width=800,height=600');
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>简历</title><style>' + baseCss + '\nhtml,body{margin:0;padding:0;background:#fff}\nbody{display:block}\n.pview{margin:0}\n@page{size:A4;margin:0}\n@media print{html,body{margin:0;padding:0;width:210mm}.pview{box-shadow:none!important;transform:none!important;width:210mm;height:297mm;overflow:hidden;padding:15mm 18mm;margin:0}.a4-pagebreak{display:none!important}.psec,.pitem{break-inside:avoid;page-break-inside:avoid}}</style></head><body>');
  w.document.body.appendChild(pv.cloneNode(true));
  w.document.close();
  setTimeout(function() { w.print(); }, 300);
}

// ── A4 打印检测 ──
function checkA4Print() {
  const pv = document.getElementById('resume-preview');
  if (!pv) return;
  const prevZoom = zoomLevel;
  if (zoomLevel !== 100) { zoomLevel = 100; applyZoom(); }

  const MM = 96 / 25.4;
  const PAGE_W = 210 * MM;
  const PAD_TOP = ((styleSettings.pageVAlign === 'free') ? 0 : 15) * MM, PAD_BOTTOM = 15 * MM, PAD_LEFT = 18 * MM, PAD_RIGHT = 18 * MM;
  const CONTENT_W = PAGE_W - PAD_LEFT - PAD_RIGHT;
  const CONTENT_H = 297 * MM - PAD_TOP - PAD_BOTTOM;

  const pvRect = pv.getBoundingClientRect();
  const contentTop = pvRect.top + PAD_TOP;
  const contentRight = pvRect.left + PAGE_W - PAD_RIGHT;

  // 1) 内容总高度与预计页数
  let contentBottom = contentTop;
  for (const child of pv.children) {
    const r = child.getBoundingClientRect();
    if (r.height > 0) contentBottom = Math.max(contentBottom, r.bottom);
  }
  const totalContentH = contentBottom - contentTop;
  const pages = Math.max(1, Math.ceil(totalContentH / CONTENT_H));

  const issues = [];

  // 2) 四方向出界检测（内容区四边：左18mm/右18mm/上15mm/下15mm）
  const boxL = pvRect.left + PAD_LEFT;
  const boxB = pvRect.top + 297 * MM - PAD_BOTTOM;
  let leftOver = 0, rightOver = 0, topOver = 0, bottomOver = 0;
  pv.querySelectorAll('*').forEach(function(el) {
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    if (r.left < boxL - 0.5) leftOver++;
    if (r.right > contentRight + 0.5) rightOver++;
    if (r.top < contentTop - 0.5) topOver++;
    if (r.bottom > boxB + 0.5) bottomOver++;
  });
  const dirs = [];
  if (leftOver > 0) dirs.push('左 ' + leftOver + ' 处');
  if (rightOver > 0) dirs.push('右 ' + rightOver + ' 处');
  if (topOver > 0) dirs.push('上 ' + topOver + ' 处');
  if (bottomOver > 0) dirs.push('下 ' + bottomOver + ' 处');
  if (dirs.length > 0) issues.push('内容出界：' + dirs.join('、') + ' 超出 A4 内容区边界');

  // 3) 跨页截断检测（模块/条目被分页切开）
  let breakCount = 0;
  pv.querySelectorAll('.pshd, .psec, .pitem, .pstitle, .plead').forEach(function(el) {
    const r = el.getBoundingClientRect();
    if (r.height === 0) return;
    const relTop = r.top - contentTop;
    const relBottom = r.bottom - contentTop;
    // 加 0.5px 容差，避免 subpixel 渲染误差把贴边元素误判为跨页
    const topPage = Math.floor((relTop + 0.5) / CONTENT_H);
    const bottomPage = Math.floor((relBottom - 0.5) / CONTENT_H);
    if (topPage !== bottomPage) breakCount++;
  });
  if (breakCount > 0) issues.push('有 ' + breakCount + ' 个模块/条目会被分页截断（内容被切到两页）');

  if (prevZoom !== 100) { zoomLevel = prevZoom; applyZoom(); }

  showA4Result({
    pages: pages,
    totalHmm: Math.round(totalContentH / MM),
    contentHmm: Math.round(CONTENT_H / MM),
    issues: issues,
    ok: issues.length === 0
  });
}

function showA4Result(r) {
  const old = document.getElementById('a4check-overlay');
  if (old) old.remove();
  const overlay = h('div', { className:'a4check-overlay', id:'a4check-overlay' });
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  const modal = h('div', { className:'a4check-modal' });
  const head = h('div', { className:'a4check-head' });
  head.appendChild(h('span', {}, '📋 A4 打印检测'));
  head.appendChild(h('button', { className:'a4check-close', onclick:function() { overlay.remove(); } }, '×'));
  modal.appendChild(head);

  const body = h('div', { className:'a4check-body' });
  const status = h('div', { className:'a4check-status ' + (r.ok ? 'ok' : 'warn') });
  status.appendChild(h('span', {}, r.ok ? '✅ 检测通过' : '⚠️ 发现问题'));
  status.appendChild(h('span', { style:{ fontWeight:'400', fontSize:'12px' } }, r.ok ? '内容都在 A4 打印范围内' : '部分内容可能打印不完整'));
  body.appendChild(status);

  const meta = h('div', { className:'a4check-meta' });
  meta.appendChild(h('div', {}, '内容高度：约 ' + r.totalHmm + ' mm（单页可用 ' + r.contentHmm + ' mm）'));
  meta.appendChild(h('div', {}, '预计打印页数：' + r.pages + ' 页'));
  body.appendChild(meta);

  if (r.ok) {
    body.appendChild(h('div', { className:'a4check-okbox' }, '所有模块、条目均未跨页，无横向溢出，可放心打印 / 导出 PDF。'));
  } else {
    const ul = h('ul', { className:'a4check-issues' });
    r.issues.forEach(function(it) { ul.appendChild(h('li', {}, it)); });
    body.appendChild(ul);
    body.appendChild(h('div', { className:'a4check-meta', style:{ marginTop:'8px', marginBottom:'0' } }, '建议：精简内容、缩小字号或调低行距，让内容收进一页；也可调整模块，避免单条内容被分页切开。'));
  }
  modal.appendChild(body);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

// ── 数值输入框「默认」状态的基准增减 ──
// 空值(默认)时按 ↑/↓ 或点步进按钮(▲/▼)：以实际默认值为基准增减一步，而不是从最小值突变。
// 基准来源：data-base（具体值）或 data-base-key（随密度变化的默认：字号/行距/间距）
function numInputBase(t) {
  var base;
  if (t.dataset.baseKey) {
    var c = DENSITY_CFG[state.density] || DENSITY_CFG.normal;
    var m = { name: c.ns, ptitle: c.ts, ts: c.ts, fs: c.fs, lh: c.lh, ig: c.ig, hg: c.sg + 4 };
    base = parseFloat(m[t.dataset.baseKey]);
  }
  if (base == null || isNaN(base)) base = parseFloat(t.dataset.base);
  if (base == null || isNaN(base)) base = parseFloat(t.min) || 0;
  return base;
}
function numInputStep(t) {
  var step = parseFloat(t.step);
  return (isNaN(step) || step <= 0) ? 1 : step;
}
function clampNum(t, v) {
  var mn = parseFloat(t.min), mx = parseFloat(t.max);
  if (!isNaN(mn) && v < mn) v = mn;
  if (!isNaN(mx) && v > mx) v = mx;
  return Math.round(v * 100) / 100;
}
document.addEventListener('keydown', function(e) {
  var t = e.target;
  if (!t || t.tagName !== 'INPUT' || (t.type !== 'number' && t.type !== 'range')) return;
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  if (t.value !== '') return;
  var step = numInputStep(t);
  var v = (e.key === 'ArrowUp') ? numInputBase(t) + step : numInputBase(t) - step;
  v = clampNum(t, v);
  t.value = v;
  e.preventDefault();
  t.dispatchEvent(new Event('input', { bubbles: true }));
  t.dispatchEvent(new Event('change', { bubbles: true }));
});

    });
  } }, '复制提示词'));

  body.appendChild(h('div', { style:{ fontWeight:600, fontSize:'12px', marginBottom:'6px', marginTop:'14px', color:'var(--t2)' } }, '② 粘贴 AI 返回的 JSON'));
  const ta = h('textarea', { className:'import-textarea', id:'import-json', placeholder:'将 AI 返回的 JSON 粘贴到这里...' });
  body.appendChild(ta);
  body.appendChild(h('button', { className:'fill-btn', onclick: doImport }, '解析并填充'));
  body.appendChild(h('div', { className:'import-status', id:'import-status' }));
}

function doImport() {
  const ta = document.getElementById('import-json');
  const status = document.getElementById('import-status');
  const raw = ta.value.trim();
  if (!raw) { status.textContent = '请先粘贴 JSON 内容'; status.className = 'import-status error'; return; }

  try {
    // Try to extract JSON from the input (handle AI wrapping in markdown code blocks)
    let jsonStr = raw;
    const codeBlock = raw.match(/```(?:json)?\s*\n([\s\S]*?)\n```/);
    if (codeBlock) jsonStr = codeBlock[1];
    const data = JSON.parse(jsonStr);

    // Fill personal info
    const info = state.resume.personalInfo;
    let filledCount = 0;
    ['name','title','phone','email','location','website'].forEach(function(k) {
      if (data[k] && !info[k]) { info[k] = data[k]; filledCount++; }
    });

    // Fill sections
    let secCount = 0;
    if (data.sections && Array.isArray(data.sections)) {
      data.sections.forEach(function(parsed) {
        if (!parsed.type || !parsed.items) return;
        let existing = state.resume.sections.find(function(s) { return s.type === parsed.type; });
       if (!existing) {
        existing = { id: uid(), type: parsed.type, title: parsed.title || '', letterSpacing: 0, lineHeight: null, items: [] };
         state.resume.sections.push(existing);
       }
        if (parsed.title && !existing.title) existing.title = parsed.title;
        const hasReal = existing.items.some(function(it) { return it.title || it.subtitle || it.startDate || it.endDate || it.description; });
        if (!hasReal || parsed.items.length > existing.items.length) {
          existing.items = parsed.items.map(function(it) { return newItem(it); });
        }
        secCount++;
      });
    }

    save();
    status.textContent = '成功导入 ' + filledCount + ' 项个人信息，' + secCount + ' 个内容模块';
    status.className = 'import-status ok';
    // Switch to sections to show result
    setTimeout(function() { switchTab('sections'); }, 500);
  } catch(e) {
    status.textContent = 'JSON 解析失败：' + e.message + '。请确保粘贴的是有效的 JSON 格式。';
    status.className = 'import-status error';
  }
}
</script>
</body>
