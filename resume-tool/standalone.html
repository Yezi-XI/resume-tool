function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) { for (const k in attrs) { if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]); else if (k === 'className') e.className = attrs[k]; else if (k === 'innerHTML') e.innerHTML = attrs[k]; else e.setAttribute(k, attrs[k]); } }
  for (const c of children) { if (c == null) continue; if (typeof c === 'string') { if (c.startsWith('<')) { const span = document.createElement('span'); span.style.display='inline-flex'; span.style.alignItems='center'; span.innerHTML = c; e.appendChild(span); } else e.appendChild(document.createTextNode(c)); } else e.appendChild(c); }
  return e;
}

function h(tag, attrs, ...children) { return el(tag, attrs, ...children); }

  const secs = state.resume.sections;

function initGlobalSpacing() {
  const lsEl = document.getElementById('global-ls');
  const lhEl = document.getElementById('global-lh');
  if (state.globalLetterSpacing == null) state.globalLetterSpacing = 0;
  if (state.globalLineHeight == null) state.globalLineHeight = null;
  lsEl.value = state.globalLetterSpacing;
  lhEl.value = state.globalLineHeight || '';
  lsEl.oninput = function(e) {
    state.globalLetterSpacing = parseFloat(e.target.value) || 0;
    save(); renderPreview();
  };
  lhEl.oninput = function(e) {
    var v = parseFloat(e.target.value);
    state.globalLineHeight = v ? v : null;
    save(); renderPreview();
  };
}

    const lbl = h('label', { className:'style-label' }, label + ': ' + (s[key] != null ? s[key] + (unit||'') : '默认'));
    row.appendChild(lbl);
    const inp = h('input', { type:'range', className:'style-slider', min:min, max:max, step:'any', value:s[key] != null ? s[key] : '', oninput: function(e) { var v = parseFloat(e.target.value); v = Math.round(v / step) * step; s[key] = v; lbl.textContent = label + ': ' + v + (unit||''); cb && cb(v); }, onchange: function() { save(); renderStyle(); renderPreview(); } });
    row.appendChild(inp);
    row.appendChild(h('button', { className:'rst-btn', style:{ marginLeft:'6px', border:'1px solid var(--border)', background:'transparent', borderRadius:'3px', cursor:'pointer', fontSize:'11px', color:'var(--t3)', padding:'0 5px' }, title:'恢复默认', onclick: function() { s[key] = DEFAULT_STYLE_SETTINGS[key]; save(); renderStyle(); renderPreview(); } }, '↺'));
    body.appendChild(row);
  }

  function toggle(label, key, cb) {
    const row = h('div', { className:'style-row' });
    row.appendChild(h('label', { className:'style-label' }, label));
    const btn = h('button', { className:'toggle-btn' + (s[key] ? ' on' : ''), onclick: function() { s[key] = !s[key]; cb && cb(s[key]); save(); renderStyle(); renderPreview(); } }, s[key] ? 'ON' : 'OFF');
    row.appendChild(btn);
    body.appendChild(row);
  }

  function color(label, key, cb) {
    const row = h('div', { className:'style-row' });
    row.appendChild(h('label', { className:'style-label' }, label));
    const inp = h('input', { type:'color', className:'style-color', value:s[key], oninput: function(e) { s[key] = e.target.value; cb && cb(s[key]); save(); renderPreview(); } });
    row.appendChild(inp);
    body.appendChild(row);
  }

  function select(label, key, opts, cb) {
    const row = h('div', { className:'style-row' });
    row.appendChild(h('label', { className:'style-label' }, label));
    const sel = h('select', { className:'style-select', onchange: function(e) { s[key] = e.target.value; cb && cb(s[key]); save(); renderPreview(); } });
    opts.forEach(function(o) { const opt = h('option', { value:o[0] }, o[1]); if (s[key] === o[0]) opt.selected = true; sel.appendChild(opt); });
    row.appendChild(sel);
    body.appendChild(row);
  }

  body.appendChild(h('h3', { className:'sh' }, '标题底色'));
  toggle('显示底色', 'titleBg');
  if (s.titleBg) {
    color('底色颜色', 'titleBgColor');
    slider('左上圆角', 'titleBgRadiusTL', 0, 20, 1, 'px');
    slider('右上圆角', 'titleBgRadiusTR', 0, 20, 1, 'px');
    slider('右下圆角', 'titleBgRadiusBR', 0, 20, 1, 'px');
    slider('左下圆角', 'titleBgRadiusBL', 0, 20, 1, 'px');
    slider('统一圆角', 'titleBgRadius', 0, 20, 1, 'px');
    slider('上下内边距', 'titleBgPaddingY', 0, 24, 1, 'px');
    slider('左右内边距', 'titleBgPaddingX', 0, 40, 1, 'px');
   select('底色范围', 'titleBgScope', [['full','整行'],['inline','仅文字'],['icon','仅LOGO']]);
    select('标题位置', 'titleBgAlign', [['center','居中'],['bottom','底部']]);
 }

  body.appendChild(h('h3', { className:'sh', style:{ marginTop:'16px' } }, '标题与图标'));
  slider('标题字号', 'titleFontSize', 10, 24, 1, 'pt');
  slider('图标大小', 'titleIconSize', -6, 4, 1, '', function(v) { });
  slider('图标与文字间距', 'titleIconGap', 2, 20, 1, 'px');

  body.appendChild(h('h3', { className:'sh', style:{ marginTop:'16px' } }, '标题前矩形块'));
  toggle('显示矩形块', 'titleBarShow');
  if (s.titleBarShow) {
    select('块数', 'titleBar', [['one','一个'],['two-same','两个（等高）'],['two-stagger','两个（错落）']]);
    color('颜色', 'titleBarColor');
    slider('块宽', 'titleBarW', 2, 12, 1, 'px');
    slider('块高', 'titleBarH', 8, 30, 1, 'px');
    slider('块间距', 'titleBarGap', 1, 12, 1, 'px');
    slider('与标题间距', 'titleBarTextGap', 0, 20, 1, 'px');
  }

  body.appendChild(h('h3', { className:'sh', style:{ marginTop:'16px' } }, '标题下划线'));
  toggle('显示整行线', 'underlineShow');
 if (s.underlineShow) {
   slider('整线粗细', 'underlineThick', 1, 6, 1, 'px');
   color('整线颜色', 'underlineColor');
 }
 toggle('显示平行四边形', 'paraShow');
 if (s.paraShow) {
   select('形状', 'paraShape', [['parallelogram','平行四边形'],['trapezoid','直角梯形']]);
   toggle('倒转', 'paraFlip');
    select('四边形位置', 'paraSpacing', [['tight','紧凑'],['center','居中'],['far','远离']]);
   slider('平行线长度', 'paraWidth', 0, 100, 2, '%');
    select('线高规格', 'paraHeight', [['thin','细'],['standard','标准'],['thick','粗']]);
    color('线条颜色', 'paraColor');
    slider('倾斜角度', 'paraSkew', -60, 0, 1, '°');
    toggle('末端小块', 'paraTailShow');
    if (s.paraTailShow) {
      slider('末端块宽', 'paraTailW', 3, 24, 1, 'px');
    }
    select('下划线位置', 'underlineAlign', [['top','顶部对齐'],['center','中线对齐'],['bottom','底部对齐']]);
 }

  body.appendChild(h('h3', { className:'sh', style:{ marginTop:'16px' } }, '正文段落前缀'));
  toggle('段落前缀', 'itemBulletShow');
  if (s.itemBulletShow) {
    select('类型', 'itemBullet', [['symbol','符号'],['icon','图标'],['number','序号']], function() { setTimeout(renderStyle, 0); });
    color('颜色', 'itemBulletColor');
    slider('与文字间距', 'itemBulletGap', 0, 12, 1, 'px');
    if (s.itemBullet === 'icon') {
      select('图标', 'itemBulletIcon', [['check','对勾'],['chevron','右箭头'],['star','星形'],['diamond','菱形'],['square','方块']]);
    } else if (s.itemBullet === 'number') {
      select('序号格式', 'itemBulletNumFmt', [['dot','1.'],['paren','1)'],['full','（1）'],['circle','①']]);
    } else {
      select('符号', 'itemBulletSymbol', [['•','圆点'],['●','实心圆'],['▪','小方块'],['■','方块'],['◆','实心菱'],['➤','箭头'],['✦','星形']]);
    }
  }

  body.appendChild(h('h3', { className:'sh', style:{ marginTop:'16px' } }, '照片设置'));
  slider('照片宽度', 'photoWidth', 40, 160, 2, 'px', function(v) { if (s.photoLockRatio && s._photoRatio) { s.photoHeight = Math.round(v / s._photoRatio); } });
  slider('照片高度', 'photoHeight', 40, 200, 2, 'px', function(v) { if (s.photoLockRatio && s._photoRatio) { s.photoWidth = Math.round(v * s._photoRatio); } });
  toggle('锁定宽高比', 'photoLockRatio');
  if (!s._photoRatio) s._photoRatio = (s.photoWidth || 80) / (s.photoHeight || 100);
  slider('水平偏移', 'photoOffsetX', -50, 50, 1, 'px');
  slider('垂直偏移', 'photoOffsetY', -50, 50, 1, 'px');
}
function renderImport() {
  const body = document.getElementById('editor-body');
  body.innerHTML = '';
  body.appendChild(h('h3', { className:'sh' }, '导入简历内容'));
  body.appendChild(h('p', { style:{ fontSize:'12px', color:'var(--t2)', marginBottom:'12px', lineHeight:'1.5' } }, '把下面的提示词复制给任意 AI（如 ChatGPT），让它根据你的简历提取结构化数据，然后把 AI 返回的 JSON 粘贴到下方输入框，点击"解析并填充"即可自动填入。'));

  body.appendChild(h('div', { style:{ fontWeight:600, fontSize:'12px', marginBottom:'6px', color:'var(--t2)' } }, '① 复制提示词'));
  const promptBox = h('div', { className:'prompt-box' }, IMPORT_PROMPT);
  body.appendChild(promptBox);
  body.appendChild(h('button', { className:'copy-btn', onclick: function() {
    navigator.clipboard.writeText(IMPORT_PROMPT).then(function() {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '已复制！';
      setTimeout(function() { btn.textContent = '复制提示词'; }, 2000);
    });
  } }, '复制提示词'));

  body.appendChild(h('div', { style:{ fontWeight:600, fontSize:'12px', marginBottom:'6px', marginTop:'14px', color:'var(--t2)' } }, '② 粘贴 AI 返回的 JSON'));
  const ta = h('textarea', { className:'import-textarea', id:'import-json', placeholder:'将 AI 返回的 JSON 粘贴到这里...' });
  body.appendChild(ta);
  body.appendChild(h('button', { className:'fill-btn', onclick: doImport }, '解析并填充'));
  body.appendChild(h('div', { className:'import-status', id:'import-status' }));
}

function doImport() {
  const ta = document.getElementById('import-json');
  const status = document.getElementById('import-status');
  const raw = ta.value.trim();
  if (!raw) { status.textContent = '请先粘贴 JSON 内容'; status.className = 'import-status error'; return; }

  try {
    // Try to extract JSON from the input (handle AI wrapping in markdown code blocks)
    let jsonStr = raw;
    const codeBlock = raw.match(/```(?:json)?\s*\n([\s\S]*?)\n```/);
    if (codeBlock) jsonStr = codeBlock[1];
    const data = JSON.parse(jsonStr);

    // Fill personal info
    const info = state.resume.personalInfo;
    let filledCount = 0;
    ['name','title','phone','email','location','website'].forEach(function(k) {
      if (data[k] && !info[k]) { info[k] = data[k]; filledCount++; }
    });

    // Fill sections
    let secCount = 0;
    if (data.sections && Array.isArray(data.sections)) {
      data.sections.forEach(function(parsed) {
        if (!parsed.type || !parsed.items) return;
        let existing = state.resume.sections.find(function(s) { return s.type === parsed.type; });
       if (!existing) {
        existing = { id: uid(), type: parsed.type, title: parsed.title || '', letterSpacing: 0, lineHeight: null, items: [] };
         state.resume.sections.push(existing);
       }
        if (parsed.title && !existing.title) existing.title = parsed.title;
        const hasReal = existing.items.some(function(it) { return it.title || it.subtitle || it.startDate || it.endDate || it.description; });
        if (!hasReal || parsed.items.length > existing.items.length) {
          existing.items = parsed.items.map(function(it) { return newItem(it); });
        }
        secCount++;
      });
    }

    save();
    status.textContent = '成功导入 ' + filledCount + ' 项个人信息，' + secCount + ' 个内容模块';
    status.className = 'import-status ok';
    // Switch to sections to show result
    setTimeout(function() { switchTab('sections'); }, 500);
  } catch(e) {
    status.textContent = 'JSON 解析失败：' + e.message + '。请确保粘贴的是有效的 JSON 格式。';
    status.className = 'import-status error';
  }
}
</script>
